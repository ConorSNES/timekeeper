[package]
name = "timekeeper"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.40", features = ["serde"] }
eframe = { version = "0.35.0", default-features = false, features = ["persistence", "wgpu", "wayland", "x11", "default_fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.139"

[profile.release]
strip = true
lto = true